name: Radar refresh

on:
  workflow_dispatch:
  # Official confirmatory run. GitHub cron uses UTC.
  # 23:30 UTC gives a 2h30-3h30 margin after the regular NYSE close across US DST.
  schedule:
    - cron: '30 23 * * 1'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'config/**'
      - 'data/universe_seed.csv'
      - 'data/brief_memory.json'
      - 'data/brief_events/**'
      - 'data/fundamentals_pit/**'
      - 'data/market_pit/**'
      - 'data/outcomes_v1.json'
      - 'data/weekly_signals.json'
      - 'data/signal_research.json'
      - 'markers.js'
      - 'fundamentals.js'
      - 'auto-refresh.js'
      - 'requirements.txt'
      - 'run.py'
      - 'favicon.svg'
      - '.github/workflows/radar.yml'

permissions:
  contents: read

# Separate event/ref groups are required because a scheduled run opens a protected
# persistence PR and waits for that PR's checks. A single global group would
# deadlock the scheduled run against its own pull_request validation.
concurrency:
  group: radar-refresh-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: research-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Validate workflow YAML
        run: python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('.github/workflows/radar.yml').read_text())"
      - name: Compile Python sources
        run: python -m py_compile scripts/*.py src/*.py
      - name: Run research integrity tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify append-only history on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/check_append_only_git.py "${{ github.event.pull_request.base.sha }}"
      - name: Verify append-only history on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_append_only_git.py "${{ github.event.before }}"
      - name: Validate market journal schema
        run: python scripts/validate_market_journal.py
      - name: Preflight automation credentials
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AUTOMATION_TOKEN is required before any confirmatory collection"
            exit 1
          fi
          push_ok="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push // false')"
          if [ "$push_ok" != "true" ]; then
            echo "::error::AUTOMATION_TOKEN cannot write repository contents"
            exit 1
          fi
      - name: Refresh operational market data
        if: github.event_name != 'pull_request'
        env:
          CONFIRMATORY_WRITE: ${{ github.event_name == 'schedule' && '1' || '0' }}
          EXPERIMENT_RUN_ID: ${{ github.run_id }}
          EXPERIMENT_COMMIT_SHA: ${{ github.sha }}
        run: python run.py --step all
      - name: Refresh cash-flow and ROIC fundamentals
        if: github.event_name != 'pull_request'
        run: python scripts/collect_fundamentals.py
      - name: Freeze observed fundamentals prospectively
        if: github.event_name == 'schedule'
        run: python scripts/freeze_fundamentals_pit.py
      - name: Freeze this week's Signal Scores only on the official schedule
        if: github.event_name == 'schedule'
        env:
          REQUIRE_MARKET_BOUNDARY: '1'
        run: python scripts/generate_weekly_signals.py
      - name: Append matured prospective outcomes
        if: github.event_name == 'schedule'
        env:
          CONFIRMATORY_WRITE: '1'
          EXPERIMENT_RUN_ID: ${{ github.run_id }}
          EXPERIMENT_COMMIT_SHA: ${{ github.sha }}
        run: python scripts/compute_outcomes.py
      - if: github.event_name != 'pull_request'
        run: python scripts/build_static_dashboard.py
      - if: github.event_name != 'pull_request'
        run: python scripts/inject_brief_memory.py
      - name: Enable chart markers, fundamentals and live deployment refresh
        if: github.event_name != 'pull_request'
        run: sed -i "s#</body>#<script src=\"/markers.js?v=${GITHUB_SHA}\"></script><script src=\"/fundamentals.js?v=${GITHUB_SHA}\"></script><script src=\"/auto-refresh.js?v=${GITHUB_SHA}\"></script></body>#" index.html
      - name: Validate confirmatory market journal before scheduled persistence
        if: github.event_name == 'schedule'
        run: python scripts/validate_market_journal.py
      - name: Verify append-only history before scheduled persistence
        if: github.event_name == 'schedule'
        run: python scripts/check_append_only_git.py HEAD
      - name: Persist scheduled outputs through protected PR
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AUTOMATION_TOKEN is required for scheduled persistence through a protected pull request"
            exit 1
          fi

          git config user.name "Rickhunter-stack"
          git config user.email "184195632+Rickhunter-stack@users.noreply.github.com"

          branch="automation/radar-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"

          # Some prospective outputs only exist on scheduled runs. Add only paths that exist.
          for path in data/veille.db data/brief_memory.json data/fundamentals.json data/fundamentals_pit data/market_pit data/outcomes_v1.json data/weekly_signals.json index.html favicon.svg markers.js fundamentals.js auto-refresh.js; do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No scheduled changes to persist."
            exit 0
          fi

          git commit -m "chore: persist scheduled radar run ${GITHUB_RUN_NUMBER}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"

          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: persist scheduled radar run ${GITHUB_RUN_NUMBER}" \
            --body "Automated persistence for scheduled run \`${GITHUB_RUN_ID}\` from source commit \`${GITHUB_SHA}\`. Confirmatory data remains subject to the repository append-only checks and protected-main rules.")"

          echo "Created $pr_url"
          pr_number="${pr_url##*/}"
          head_sha="$(git rev-parse HEAD)"

          # Fine-grained PATs cannot use the Checks API directly. Poll the PR's
          # protected-branch merge state instead; "clean" means the required
          # status checks and branch rules are satisfied.
          for attempt in $(seq 1 80); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.mergeable_state')"
            echo "Protected PR mergeable_state=$state (attempt $attempt/80)"
            if [ "$state" = "clean" ]; then
              break
            fi
            if [ "$state" = "dirty" ]; then
              echo "::error::Automation PR has merge conflicts"
              exit 1
            fi
            if [ "$attempt" -eq 80 ]; then
              echo "::error::Timed out waiting for protected PR checks"
              exit 1
            fi
            sleep 15
          done

          merged="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
            -f merge_method=merge \
            -f sha="$head_sha" \
            --jq '.merged')"
          if [ "$merged" != "true" ]; then
            echo "::error::Protected automation PR was not merged"
            exit 1
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
