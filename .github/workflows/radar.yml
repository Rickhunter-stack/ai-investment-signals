name: Radar refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run.py --step all
      - run: python scripts/build_static_dashboard.py
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name "ai-investment-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/veille.db index.html
          git diff --cached --quiet || git commit -m "chore: refresh market snapshot and dashboard"
          git push
