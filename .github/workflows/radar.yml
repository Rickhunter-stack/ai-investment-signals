name: Radar refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'config/**'
      - 'data/universe_seed.csv'
      - 'data/brief_memory.json'
      - 'data/weekly_signals.json'
      - 'data/signal_research.json'
      - 'markers.js'
      - 'fundamentals.js'
      - 'requirements.txt'
      - 'run.py'
      - 'favicon.svg'
      - '.github/workflows/radar.yml'

permissions:
  contents: write

concurrency:
  group: radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run.py --step all
      - name: Refresh cash-flow and ROIC fundamentals
        run: python scripts/collect_fundamentals.py
      - name: Test weekly snapshot integrity
        run: python -m unittest discover -s scripts -p 'test_weekly_signals.py'
      - name: Freeze this week's Signal Scores
        run: python scripts/generate_weekly_signals.py
      - run: python scripts/build_static_dashboard.py
      - run: python scripts/inject_brief_memory.py
      - name: Enable chart markers and fundamentals
        run: sed -i "s#</body>#<script src=\"/markers.js?v=${GITHUB_SHA}\"></script><script src=\"/fundamentals.js?v=${GITHUB_SHA}\"></script></body>#" index.html
      - name: Commit refreshed data and dashboard
        run: |
          # Keep automated commits attributable to the repository owner so
          # connected deployment providers accept and deploy them.
          git config user.name "Rickhunter-stack"
          git config user.email "184195632+Rickhunter-stack@users.noreply.github.com"
          git add data/veille.db data/brief_memory.json data/fundamentals.json data/weekly_signals.json index.html favicon.svg markers.js fundamentals.js
          git diff --cached --quiet || git commit -m "chore: refresh market, fundamentals and dashboard"
          git push
